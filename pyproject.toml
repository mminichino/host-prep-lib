[project]
name = "pyhostprep"
description = "Couchbase Host Automation Library"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Michael Minichino", email = "info@unix.us.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["couchbase", "devops", "automation"]
requires-python = ">=3.10,<4"
dependencies = [
    "attrs>=22.2.0",
    "pydantic>=2.0.0",
    "docker>=5.0.3",
    "ansible>=6.7.0",
    "ansible-runner>=2.3.3",
    "requests>=2.31.0",
    "urllib3>=1.26.16",
    "overrides>=7.4.0",
    "psutil>=5.9.5",
    "Jinja2>=3.0.0",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/mminichino/host-prep-lib"

[project.scripts]
bundlemgr = "pyhostprep.bundlemgr:main"
swmgr = "pyhostprep.swmgr:main"
storagemgr = "pyhostprep.storagemgr:main"

[dependency-groups]
dev = [
    "hatch",
]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-rerunfailures>=10.3",
    "pytest-mock>=3.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyhostprep"]

[tool.hatch.build.targets.sdist]
include = [
    "pyhostprep/data/config/*",
    "pyhostprep/data/playbooks/*",
]

[tool.hatch.version]
path = "pyhostprep/__init__.py"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
addopts = "-rE --no-header -v -p no:warnings"
log_file = "pytest.log"
log_file_level = "DEBUG"
pythonpath = [
    ".",
    "tests",
]
testpaths = [
    "tests",
]
python_classes = [
    "Test*",
]
python_files = [
    "test_[0-9]*.py",
]
markers = [
    "unit_test: marks a test as a unit test",
    "regression_test: marks a test as a regression test",
]

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py313", "py312", "py310"]
no_package = true

[tool.tox.env_run_base]
skip_install = true
allowlist_externals = ["uv"]
commands_pre = [["uv", "sync", "--locked", "--all-groups"]]
commands = [["uv", "run", "pytest", "-m", "unit_test"]]

[tool.tox.env.py310]
description = "Posix 3.10 full test"
env_python = "python3.10"
commands_pre = [["uv", "sync", "--locked", "--all-groups", "--python", "3.10"]]

[tool.tox.env.py312]
description = "Posix 3.12 full test"
env_python = "python3.12"
commands_pre = [["uv", "sync", "--locked", "--all-groups", "--python", "3.12"]]

[tool.tox.env.py313]
description = "Posix 3.13 full test"
env_python = "python3.13"
commands_pre = [["uv", "sync", "--locked", "--all-groups", "--python", "3.13"]]
